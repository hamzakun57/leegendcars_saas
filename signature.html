<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signature du contrat — Leegend Cars</title>
<!-- Config Supabase (supabaseUrl + supabaseAnonKey) chargée en premier -->
<script src="/admin-assets/admin-config.js"></script>
<style>
  :root { color-scheme: light }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; color: #15181d }
  .page { max-width: 680px; margin: 0 auto; padding: 28px 18px 60px }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 26px }
  .brand-logo-wrap { position: relative; display: block; width: 92px; height: 92px;
                     overflow: hidden; flex: 0 0 auto }
  .brand-logo { position: absolute; left: -33.333%; top: -37.778%; width: 166.667%;
                height: 166.667%; max-width: none; object-fit: contain }
  .brand-name { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.1; font-weight: 750;
                letter-spacing: .01em; color: #282b30 }
  .card { background: #fff; border: 1px solid #e2e6ec; border-radius: 10px; padding: 20px;
          margin-bottom: 18px }
  .welcome { background: #e8f8ef; border-left: 8px solid #27bd78; padding: 24px 22px;
             font-size: 1.15rem; line-height: 1.55 }
  .welcome b { font-weight: 750 }
  .welcome p + p { margin-top: 4px }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 12px 2px;
        border-bottom: 1px solid #dfe2e5; font-size: 1.08rem }
  .kv:last-child { border: 0 }
  .kv span { font-weight: 700 }
  .kv b { text-align: right; font-weight: 450 }
  .dates { background: #f4f5f6; font-size: 1.08rem; line-height: 1.7 }
  .dates p + p { margin-top: 6px }
  label { display: block; font-weight: 700; margin: 4px 0 8px; font-size: 1rem }
  .pad-wrap { position: relative; margin-top: 4px; border: 2px dashed #aeb3b8;
              border-radius: 10px; overflow: hidden; background: #fff }
  canvas { display: block; width: 100%; height: 180px; touch-action: none; cursor: crosshair }
  .pad-hint { position: absolute; inset: 0; display: grid; place-items: center;
              color: #8b9199; font-size: .9rem; pointer-events: none }
  .pad-hint.gone { display: none }
  .hint { color: #707780; font-size: .9rem; margin-top: 8px }
  .row { display: flex; gap: 10px; margin-top: 14px }
  .btn { padding: 11px 18px; border: 0; border-radius: 10px; background: #e2e6ec;
         color: #15181d; font: 600 .95rem system-ui; cursor: pointer }
  .btn-primary { background: #25b978; color: #fff }
  .btn:disabled { opacity: .45; cursor: default }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: .95rem; display: none }
  .msg.err { display: block; background: #ff443822; border: 1px solid #e2403499; color: #9d1d13 }
  .msg.ok  { display: block; background: #2fd07a26; border: 1px solid #1cb0658c; color: #045f37 }
  .frame-wrap { background: #3a3a40; border-radius: 10px; padding: 12px; overflow: auto; margin-top: 10px }
  .contract-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                      flex-wrap: wrap; margin: 24px 0 8px; color: #30343a }
  iframe { width: 100%; height: 1100px; border: 0; background: #fff; border-radius: 6px; display: block }
  .loading { text-align: center; padding: 60px 0; color: #5a6069 }
  .err-page { text-align: center; padding: 60px 16px; color: #9d1d13 }
  .status { margin: 0 0 16px; padding: 14px 16px; border-radius: 10px; font-weight: 600 }
  .status:empty { display: none }
  .status.ok { background: #e8f8ef; border: 1px solid #9ddbb9; color: #14653d }
  .status.err { background: #ffebeb; border: 1px solid #e7aaaa; color: #9d1d13 }
  .download { border: 0; border-radius: 9px; padding: 11px 16px; background: #25b978;
              color: #fff; font: 700 .95rem system-ui; cursor: pointer }
  .download:disabled { opacity: .5; cursor: default }
  @media (max-width: 520px) {
    .page { padding: 22px 14px 40px }
    header { gap: 12px; margin-bottom: 20px }
    .brand-logo-wrap { width: 76px; height: 76px }
    .welcome { padding: 18px 16px; font-size: 1.02rem }
    .card { padding: 16px }
    .kv { gap: 10px; font-size: .98rem }
    .dates { font-size: .98rem }
    .row .btn { flex: 1 }
  }
</style>
</head>
<body>
<div class="page" id="root">
  <div class="loading">Chargement…</div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ helpers */
  var e = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* ------------------------------------------------------------------ config
     LCAdminConfig is loaded by admin-config.js ; on the public site (this page)
     we load the same file to get the Supabase URL and anon key. */
  function getConfig() {
    var cfg = window.LCAdminConfig || (window.DATA && window.DATA.CFG) || {};
    return {
      url: cfg.supabaseUrl || "https://dqygspzmndcsbkxeiulm.supabase.co",
      key: cfg.supabaseAnonKey || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxeWdzcHptbmRjc2JreGVpdWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTkyODEsImV4cCI6MjEwNzIzNTI4MX0.2Xw305r5GJtBn85tnVPFs8MCLgJuiPLK9gnSSmu2pZI",
    };
  }

  var token = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || "";
  var root  = document.getElementById("root");

  if (!token) {
    root.innerHTML = '<div class="err-page"><b>Lien invalide.</b><br>Ce lien de signature est incomplet ou corrompu.</div>';
    return;
  }

  var cfg = getConfig();
  var EDGE = cfg.url + "/functions/v1/signature/" + encodeURIComponent(token);

  /* ------------------------------------------------------------------ fetch dossier */
  fetch(EDGE, {
    headers: { "Authorization": "Bearer " + cfg.key, "apikey": cfg.key }
  })
  .then(function (r) {
    return r.text().then(function (text) {
      var data = null;
      try {
        data = JSON.parse(text);
      } catch (err) {
        if (text.includes("<!doctype") || text.includes("<html")) {
          document.open();
          document.write(text);
          document.close();
          return;
        }
      }
      if (!data || !data.ok) {
        throw new Error((data && data.error) || (r.status === 404 ? "Lien de signature introuvable ou expiré." : (r.status === 410 ? "Ce contrat n'est plus ouvert à la signature." : "Erreur de chargement.")));
      }
      renderPage(data);
    });
  })
  .catch(function (err) {
    root.innerHTML = '<div class="err-page"><b>' + e(err.message || "Erreur.") + '</b><br>Veuillez contacter l\'agence.</div>';
  });

  /* ------------------------------------------------------------------ render */
  function renderPage(data) {
    var d = data.dossier || {};
    var signedAlready = !!data.signed;

    /* Header */
    var html = '<header>'
      + '<span class="brand-logo-wrap"><img class="brand-logo" src="' + e(data.logo) + '" alt="Logo Leegend cars"></span>'
      + '<div class="brand-name">Leegend cars</div>'
      + '</header>';

    html += '<div class="card welcome">'
      + '<p>Bonjour <b>' + e(d.driver) + '</b>,</p>'
      + '<p>Merci de faire confiance à <b>Leegend cars</b>.</p>'
      + '<p>Veuillez signer le contrat ci-dessous pour confirmer votre réservation n° <b>' + e(d.contractNumber) + '</b>.</p>'
      + '</div>';

    html += '<div class="card">'
      + '<div class="kv"><span>Véhicule :</span><b>' + e(d.vehicle) + '</b></div>'
      + '<div class="kv"><span>Montant total :</span><b>' + e(d.total) + ' dh</b></div>'
      + '<div class="kv"><span>Assurance :</span><b>' + e(d.insurance) + '</b></div>'
      + '<div class="kv"><span>Livraison :</span><b>' + e(d.pickup) + '</b></div>'
      + '<div class="kv"><span>Récupération :</span><b>' + e(d.retour) + '</b></div>'
      + '</div>';

    html += '<div class="card dates">'
      + '<p><b>Départ :</b> ' + e(d.pickupDate) + (d.pickupTime ? ' à ' + e(d.pickupTime) : '') + '</p>'
      + '<p><b>Retour :</b> ' + e(d.returnDate) + (d.returnTime ? ' à ' + e(d.returnTime) : '') + '</p>'
      + '</div>';

    if (signedAlready) {
      html += '<div class="status ok">Votre signature est enregistrée. Le contrat signé est affiché ci-dessous.</div>';
    } else {
      html += '<div class="card" id="sig-card">'
        + '<label for="sig-canvas">Votre signature</label>'
        + '<div class="pad-wrap">'
        + '<canvas id="sig-canvas"></canvas>'
        + '<div class="pad-hint" id="sig-hint">Signez ici avec le doigt ou la souris</div>'
        + '</div>'
        + '<p class="hint">Signez dans le cadre avec votre doigt ou votre souris. Les informations du contrat ne sont pas modifiables.</p>'
        + '<div class="row">'
        + '<button class="btn" id="btn-clear">Effacer</button>'
        + '<button class="btn btn-primary" id="btn-send" disabled>Envoyer ma signature</button>'
        + '</div>'
        + '<div class="msg" id="sig-msg"></div>'
        + '</div>';
    }

    /* Contract iframe */
    html += '<div class="contract-heading"><h2>Contrat complet</h2>'
      + (signedAlready ? '<button class="download" id="btn-download" disabled>Télécharger le contrat signé (PDF)</button>' : '')
      + '</div>'
      + '<div class="frame-wrap"><iframe id="doc-frame" title="Contrat de location"></iframe></div>'
      + '<div class="status" id="contract-status" role="status"></div>';

    root.innerHTML = html;

    /* Load contract in iframe via Blob (avoids CORS / content-type issues) */
    loadContractFrame();

    if (!signedAlready) {
      bindSignaturePad();
    } else {
      document.getElementById("btn-download").addEventListener("click", function () {
        var frame = document.getElementById("doc-frame");
        if (frame && frame.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
        }
      });
    }
  }

  /* ------------------------------------------------------------------ iframe */
  function loadContractFrame() {
    fetch(EDGE + "/contrat", {
      headers: { "Authorization": "Bearer " + cfg.key, "apikey": cfg.key }
    })
    .then(function (r) {
      return r.text().then(function (text) {
        if (!r.ok) throw new Error("Le contrat n'a pas pu être chargé.");
      var htmlContent = "";
      try {
        var data = JSON.parse(text);
        htmlContent = data.html || "";
      } catch (e) {
        if (text.includes("<!doctype") || text.includes("<html")) {
          htmlContent = text;
        }
      }
      if (!htmlContent) throw new Error("Le contrat reçu est vide.");
      var blob = new Blob([htmlContent], { type: "text/html; charset=utf-8" });
      var burl = URL.createObjectURL(blob);
      var iframe = document.getElementById("doc-frame");
      if (!iframe) return;
      return new Promise(function (resolve) {
        iframe.addEventListener("load", function () {
          URL.revokeObjectURL(burl);
          var button = document.getElementById("btn-download");
          if (button) button.disabled = false;
          resolve();
        }, { once: true });
        iframe.src = burl;
      });
      });
    })
    .catch(function (err) {
      var status = document.getElementById("contract-status");
      if (status) {
        status.className = "status err";
        status.textContent = err.message || "Impossible de charger le contrat. Rechargez la page ou contactez l'agence.";
      }
    });
  }

  /* ------------------------------------------------------------------ pad */
  function bindSignaturePad() {
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx    = canvas.getContext("2d");
    var hint   = document.getElementById("sig-hint");
    var msgEl  = document.getElementById("sig-msg");
    var btnSend = document.getElementById("btn-send");
    var btnClear = document.getElementById("btn-clear");
    var drawing = false;
    var hasMark = false;

    function resize() {
      var dpr = Math.max(window.devicePixelRatio || 1, 1);
      var rect = canvas.getBoundingClientRect();
      /* Preserve existing drawing on resize */
      var img = hasMark ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
      canvas.width  = rect.width  * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.strokeStyle = "#15181d";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (img && img.width) ctx.putImageData(img, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    function pos(ev) {
      var p = ev.touches ? ev.touches[0] : ev;
      var r = canvas.getBoundingClientRect();
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }

    function onDown(ev) {
      ev.preventDefault();
      drawing = true;
      var p = pos(ev);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    function onMove(ev) {
      if (!drawing) return;
      ev.preventDefault();
      var p = pos(ev);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      hasMark = true;
      if (hint) hint.classList.add("gone");
      if (btnSend) btnSend.disabled = false;
    }
    function onUp() { drawing = false; }

    canvas.addEventListener("mousedown",  onDown);
    canvas.addEventListener("mousemove",  onMove);
    window.addEventListener("mouseup",    onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove",  onMove, { passive: false });
    canvas.addEventListener("touchend",   onUp);

    btnClear && btnClear.addEventListener("click", function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
      hasMark = false;
      if (hint) hint.classList.remove("gone");
      if (btnSend) btnSend.disabled = true;
      say("", "");
    });

    btnSend && btnSend.addEventListener("click", function () {
      if (!hasMark)        { say("La zone de signature est vide.", "err"); return; }
      btnSend.disabled = true;
      btnSend.textContent = "Enregistrement…";
      var sigData = canvas.toDataURL("image/png");
      fetch(EDGE, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.key,
          "apikey": cfg.key,
        },
        body: JSON.stringify({ signature: sigData }),
      })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error(j && j.error ? j.error : "Envoi refusé.");
        return fetch(EDGE, {
          headers: { "Authorization": "Bearer " + cfg.key, "apikey": cfg.key }
        }).then(function (response) {
          return response.json().then(function (fresh) {
            if (!response.ok || !fresh || !fresh.ok || !fresh.signed) {
              throw new Error((fresh && fresh.error) || "Signature enregistrée, mais impossible de charger le contrat signé. Rechargez la page.");
            }
            renderPage(fresh);
            window.scrollTo(0, 0);
          });
        });
      })
      .catch(function (err) {
        say(err.message || "Envoi impossible.", "err");
        btnSend.disabled = false;
        btnSend.textContent = "Envoyer ma signature";
      });
    });

    function say(text, kind) {
      if (!msgEl) return;
      msgEl.textContent = text;
      msgEl.className = "msg" + (kind ? " " + kind : "");
    }
  }

})();
</script>
</body>
</html>
